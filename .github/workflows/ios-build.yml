name: iOS Build (Simulator, unsigned)

# MAC-1：把 hmy_krkr_host.mm 接回 App 目标，和真实的 krkrsdl3 静态库一起链接。
# 仍然是 Simulator + 无签名，不生成 IPA、不做真机。

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "HeYiWei/**"
      - "project.yml"
      - ".github/workflows/ios-build.yml"

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # 先编引擎（vcpkg 有缓存，第二次起较快）
  engine:
    uses: ./.github/workflows/krkr-engine.yml

  build:
    name: Build HeYiWei (Simulator, engine linked)
    needs: engine
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain versions
        run: |
          {
            echo "## Toolchain"
            echo '```'
            sw_vers
            xcodebuild -version
            echo -n "iphonesimulator SDK: "; xcrun --sdk iphonesimulator --show-sdk-version
            swift --version
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Download engine artifacts
        uses: actions/download-artifact@v4
        with:
          name: krkrsdl3-simulator
          path: engine-dl

      - name: Prepare engine tree
        run: |
          set -e
          mkdir -p engine
          cp engine-dl/libkrkrsdl3.a engine/
          tar -xzf engine-dl/vcpkg-sim.tar.gz -C engine
          echo "--- 静态库 ---"; ls -lh engine/libkrkrsdl3.a
          echo "--- vcpkg 目录 ---"; ls engine/vcpkg_installed
          echo "--- 静态库数量 ---"; ls engine/vcpkg_installed/arm64-ios-simulator/lib/*.a | wc -l

      - name: Install XcodeGen
        run: |
          brew install xcodegen || brew upgrade xcodegen
          xcodegen --version

      - name: Generate Xcode project
        run: |
          xcodegen generate
          xcodebuild -list -project HeYiWei.xcodeproj

      # 现在 host 必须真的进 Compile Sources（和上一阶段相反）
      - name: Verify host is compiled
        run: |
          set -e
          PBX=HeYiWei.xcodeproj/project.pbxproj
          if ! grep -q "hmy_krkr_host" "$PBX"; then
            echo "::error::hmy_krkr_host.mm 不在工程里，MAC-1 没生效"
            exit 1
          fi
          echo "OK: hmy_krkr_host.mm 已进入工程"

      - name: Build (Simulator, unsigned, engine linked)
        id: build
        run: |
          set +o pipefail
          VCPKG="$PWD/engine/vcpkg_installed/arm64-ios-simulator"
          LIBS="-Wl,-force_load,$PWD/engine/libkrkrsdl3.a"
          for a in "$VCPKG"/lib/*.a; do
            LIBS="$LIBS -l$(basename "$a" .a | sed 's/^lib//')"
          done
          LIBS="$LIBS -framework UIKit -framework AVFoundation -framework AudioToolbox -framework CoreGraphics -framework QuartzCore -framework GameController -framework Metal -framework OpenGLES -framework CoreMotion -framework CoreVideo"
          xcodebuild \
            -project HeYiWei.xcodeproj \
            -scheme HeYiWei \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            HEADER_SEARCH_PATHS="$VCPKG/include $VCPKG/include/freetype2 $PWD/HeYiWei/Engines/Bridge" \
            LIBRARY_SEARCH_PATHS="$PWD/engine $VCPKG/lib" \
            OTHER_LDFLAGS="$LIBS" \
            build 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          echo "xcodebuild 退出码: $status"
          echo "XCODEBUILD_STATUS=$status" >> "$GITHUB_ENV"
          echo "=== 前 40 条 error ==="
          grep -n "error:" build.log | head -40 || echo "(没有 error: 行)"
          exit 0

      - name: Summarize for job summary
        if: always()
        run: |
          {
            echo "## Build result"
            echo '```'
            echo "xcodebuild status: ${XCODEBUILD_STATUS:-unknown}"
            if [ -f build.log ]; then
              grep -n "error:" build.log | head -40 || echo "(no error: lines)"
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: build.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload simulator .app
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HeYiWei-simulator-app
          path: |
            build/Build/Products/Debug-iphonesimulator/*.app
            build/Build/Products/Debug-iphonesimulator/*.app.dSYM
          if-no-files-found: warn
          retention-days: 14

      - name: Fail job if xcodebuild failed
        if: env.XCODEBUILD_STATUS != '0'
        run: |
          echo "::error::xcodebuild 失败（状态码 ${XCODEBUILD_STATUS}）"
          exit 1
