name: iOS Build (Simulator, unsigned)

# 第一阶段目标：只验证「何意味 iOS App 本体」能不能编译。
# 不签名、不装真机、不编 KRKR/ONS 引擎。

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "HeYiWei/**"
      - "project.yml"
      - ".github/workflows/ios-build.yml"

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build HeYiWei (Simulator, no signing)
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---------------------------------------------------------------
      # 环境记录：以后遇 API / Swift 版本问题可以对齐环境
      # ---------------------------------------------------------------
      - name: Toolchain versions
        run: |
          {
            echo "## Toolchain"
            echo '```'
            sw_vers
            echo
            xcodebuild -version
            echo
            echo -n "iphonesimulator SDK: "; xcrun --sdk iphonesimulator --show-sdk-version
            echo
            swift --version
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Install XcodeGen
        run: |
          brew install xcodegen || brew upgrade xcodegen
          xcodegen --version

      - name: Generate Xcode project
        run: |
          xcodegen generate
          echo "--- 生成的 target 列表 ---"
          xcodebuild -list -project HeYiWei.xcodeproj

      # ---------------------------------------------------------------
      # 硬性检查：第一轮不允许 KRKR ObjC++ host 进入 target
      # ---------------------------------------------------------------
      - name: Verify KRKR host is excluded
        run: |
          if grep -q "hmy_krkr_host" HeYiWei.xcodeproj/project.pbxproj; then
            echo "::error::hmy_krkr_host.mm 进入了工程，第一轮不该编译它"
            grep -n "hmy_krkr_host" HeYiWei.xcodeproj/project.pbxproj
            exit 1
          fi
          echo "OK: hmy_krkr_host.mm 未进入工程"

      # ---------------------------------------------------------------
      # 无签名编译（-target 不依赖 scheme，规避 xcodegen 未生成 scheme）
      # ---------------------------------------------------------------
      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project HeYiWei.xcodeproj \
            -target HeYiWei \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log

      # ---------------------------------------------------------------
      # 失败时把「第一批 error」直接写进 Summary，方便从根错误开始改
      # ---------------------------------------------------------------
      - name: Extract first errors
        if: always()
        run: |
          {
            echo "## First errors (最多 40 条)"
            echo '```'
            if [ -f build.log ]; then
              grep -n "error:" build.log | head -40
            else
              echo "build.log 不存在（编译未开始？）"
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: build.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload simulator .app
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HeYiWei-simulator-app
          path: build/Build/Products/Debug-iphonesimulator/HeYiWei.app
          if-no-files-found: warn
          retention-days: 7
